# Shared proxy headers for all Odoo locations.
#
# X-Forwarded-Host is MANDATORY: odoo/http.py only activates the ProxyFix
# middleware when both `proxy_mode = True` (odoo.conf) AND the request carries
# HTTP_X_FORWARDED_HOST. Without it Odoo believes every request is plain HTTP,
# which rewrites web.base.url to http://, drops the Secure flag on the session
# cookie, and emits http:// redirects after login.

proxy_http_version    1.1;
proxy_set_header      Host              $host;
proxy_set_header      X-Real-IP         $remote_addr;
proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header      X-Forwarded-Proto $scheme;
proxy_set_header      X-Forwarded-Host  $host;
proxy_set_header      X-Forwarded-Port  $server_port;

proxy_redirect        off;
proxy_read_timeout    900s;
proxy_connect_timeout 900s;
proxy_send_timeout    900s;
