upstream odoo {
    server 127.0.0.1:8069;
}

# gevent worker — websockets / longpolling
upstream odoochat {
    server 127.0.0.1:8072;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name lesouverain-larabia.com www.lesouverain-larabia.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server block
server {
    # NOTE: nginx here is 1.24 — HTTP/2 is enabled via the `http2` listen
    # parameter set by another vhost on 0.0.0.0:443, not the 1.25+ `http2 on;`
    # directive. Do not add `http2 on;`, it will fail `nginx -t` on 1.24.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lesouverain-larabia.com www.lesouverain-larabia.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/lesouverain-larabia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lesouverain-larabia.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-javascript image/svg+xml
               application/vnd.ms-fontobject application/x-font-ttf font/opentype;

    # ─── Odoo ERP ────────────────────────────────────────────────────────────
    #
    # Every Odoo location uses `proxy_pass http://odoo;` with no URI part, so
    # the original request URI reaches Odoo untouched. Do not append a path —
    # that would make nginx rewrite the URI and break Odoo's router.

    # /login → Odoo login page (URL stays /login for the user)
    location = /login {
        proxy_pass http://odoo/web/login;
        include    /etc/nginx/snippets/odoo-proxy.conf;
    }

    # Odoo backend — matches /odoo, /odoo/ and /odoo/<anything>.
    # `^~` stops nginx from evaluating regex locations for this prefix.
    location ^~ /odoo {
        proxy_pass http://odoo;
        include    /etc/nginx/snippets/odoo-proxy.conf;
    }

    # Odoo web client (login page, static assets, etc.)
    location /web/ {
        proxy_pass http://odoo;
        include    /etc/nginx/snippets/odoo-proxy.conf;
    }

    location /jsonrpc {
        proxy_pass http://odoo;
        include    /etc/nginx/snippets/odoo-proxy.conf;
    }

    location /website/ {
        proxy_pass http://odoo;
        include    /etc/nginx/snippets/odoo-proxy.conf;
    }

    location /web_editor/ {
        proxy_pass http://odoo;
        include    /etc/nginx/snippets/odoo-proxy.conf;
    }

    location /portal/ {
        proxy_pass http://odoo;
        include    /etc/nginx/snippets/odoo-proxy.conf;
    }

    location /report/ {
        proxy_pass http://odoo;
        include    /etc/nginx/snippets/odoo-proxy.conf;
    }

    location /mail/ {
        proxy_pass http://odoo;
        include    /etc/nginx/snippets/odoo-proxy.conf;
    }

    location = /favicon.ico {
        proxy_pass http://odoo;
        include    /etc/nginx/snippets/odoo-proxy.conf;
    }

    # Per-module static files: /<module>/static/... — app icons, images, JS.
    # Odoo serves one such prefix per installed module (153 of them here), so
    # they cannot be listed as individual prefix blocks. Matched generically;
    # the (?!app/) lookahead keeps the SPA mount point out, since a regex
    # location would otherwise win over the plain `location /app/` prefix.
    location ~ ^/(?!app/)[A-Za-z0-9_]+/static/ {
        proxy_pass http://odoo;
        include    /etc/nginx/snippets/odoo-proxy.conf;
    }

    # Real-time channels → gevent worker (8072)
    location /websocket {
        proxy_pass http://odoochat;
        include    /etc/nginx/snippets/odoo-proxy.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /longpolling/ {
        proxy_pass http://odoochat;
        include    /etc/nginx/snippets/odoo-proxy.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /bus/ {
        proxy_pass http://odoo;
        include    /etc/nginx/snippets/odoo-proxy.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /discuss/ {
        proxy_pass http://odoo;
        include    /etc/nginx/snippets/odoo-proxy.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── HorizonEcole API (Node.js on port 4002) ─────────────────────────────

    location /api/ {
        proxy_pass         http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    location /auth/ {
        proxy_pass         http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass         http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api-docs {
        proxy_pass         http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── HorizonEcole SPA (served under /app/) ───────────────────────────────

    location = /app {
        return 301 /app/;
    }

    # Vite emits content-hashed filenames under /app/assets/, safe to cache hard.
    location ^~ /app/assets/ {
        alias /var/www/lesouverain/apps/web/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location /app/ {
        alias /var/www/lesouverain/apps/web/dist/;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ @spa_app;
    }

    # SPA shell — must never be cached, otherwise deploys go unnoticed
    location @spa_app {
        root /var/www/lesouverain/apps/web/dist;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control   "no-store"   always;
        try_files /index.html =404;
    }

    # ─── Root & catch-all ────────────────────────────────────────────────────

    location = / {
        return 302 /app/;
    }

    location / {
        return 302 /app$request_uri;
    }
}
