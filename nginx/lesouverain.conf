# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name lesouverain-larabia.com www.lesouverain-larabia.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lesouverain-larabia.com www.lesouverain-larabia.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/lesouverain-larabia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lesouverain-larabia.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-javascript image/svg+xml
               application/vnd.ms-fontobject application/x-font-ttf font/opentype;

    # ─── Odoo ERP ────────────────────────────────────────────────────────────

    # /login → Odoo login page (proxy direct, URL reste /login)
    location = /login {
        proxy_pass            http://127.0.0.1:8069/web/login;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    900s;
    }

    # Odoo web client (login page, static assets, etc.)
    location /web/ {
        proxy_pass            http://127.0.0.1:8069/web/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_read_timeout    900s;
        proxy_connect_timeout 900s;
        proxy_send_timeout    900s;
    }

    # Odoo main interface (post-login, Odoo 17+)
    location /odoo/ {
        proxy_pass            http://127.0.0.1:8069/odoo/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_read_timeout    900s;
        proxy_connect_timeout 900s;
        proxy_send_timeout    900s;
    }

    # Odoo JSON-RPC
    location /jsonrpc {
        proxy_pass         http://127.0.0.1:8069/jsonrpc;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    # Odoo long polling (chat, notifications)
    location /longpolling/ {
        proxy_pass            http://127.0.0.1:8072/longpolling/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_read_timeout    900s;
    }

    # Odoo PDF reports
    location /report/ {
        proxy_pass         http://127.0.0.1:8069/report/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    # Odoo mail thread assets
    location /mail/ {
        proxy_pass         http://127.0.0.1:8069/mail/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    # Odoo website module (translations, pages, etc.)
    location /website/ {
        proxy_pass         http://127.0.0.1:8069/website/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    # Odoo bus / real-time notifications (Odoo 17+)
    location /bus/ {
        proxy_pass            http://127.0.0.1:8069/bus/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_read_timeout    900s;
    }

    # Other Odoo module paths
    location /web_editor/ {
        proxy_pass         http://127.0.0.1:8069/web_editor/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    location /portal/ {
        proxy_pass         http://127.0.0.1:8069/portal/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    location /discuss/ {
        proxy_pass            http://127.0.0.1:8069/discuss/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_read_timeout    900s;
    }

    # ─── HorizonEcole API (Node.js on port 4002) ─────────────────────────────

    location /api/ {
        proxy_pass         http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    location /auth/ {
        proxy_pass         http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass         http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "" always;
    }

    location /api-docs {
        proxy_pass         http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── HorizonEcole SPA (served under /app/) ───────────────────────────────

    # Canonical redirect: /app → /app/
    location = /app {
        return 301 /app/;
    }

    # Serve the React SPA at /app/
    location /app/ {
        alias /var/www/lesouverain/apps/web/dist/;
        try_files $uri $uri/ @spa_app;
    }

    location @spa_app {
        root /var/www/lesouverain/apps/web/dist;
        try_files /index.html =404;
    }

    # ─── Root & catch-all ────────────────────────────────────────────────────

    # Root → redirect to HorizonEcole
    location = / {
        return 302 /app/;
    }

    # Anything else → try as SPA route
    location / {
        return 302 /app$request_uri;
    }
}
