name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy LeSouverain
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd /var/www/lesouverain

            echo "=== Git pull ==="
            git pull origin main

            echo "=== Install dependencies ==="
            pnpm install --no-frozen-lockfile

            echo "=== Generate Prisma client ==="
            pnpm db:generate

            echo "=== Build ==="
            pnpm run build

            echo "=== Run migrations ==="
            pnpm db:migrate:deploy

            echo "=== Restart PM2 ==="
            pm2 restart lesouverain-api || pm2 start ecosystem.config.cjs --env production

            pm2 save

            echo "=== Health check ==="
            sleep 3
            curl -sf http://localhost:4002/api/health && echo "Health OK" || echo "Health check failed (check pm2 logs)"
